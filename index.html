<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<title>Deutsch</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1c1d20; --muted:#6b6e76; --line:#e2e0db;
  --accent:#2f5bd3; --accent-ink:#ffffff; --ok:#1a7f37; --ok-bg:#e3f4e8; --bad:#c62f2f; --bad-bg:#fbe6e6;
  --warn:#8a5a00; --warn-bg:#fff3d6; --chip:#eceae5;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16171a; --card:#212328; --text:#ecebe8; --muted:#9a9ca3; --line:#33363d;
    --accent:#7d9cff; --accent-ink:#0f1220; --ok:#5fd07e; --ok-bg:#183223; --bad:#ff7b7b; --bad-bg:#3a1d1f;
    --warn:#f0c46a; --warn-bg:#3a3018; --chip:#2c2f35;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 84px) calc(var(--safe-l) + 16px);
  -webkit-text-size-adjust:100%}
h1{font-size:28px;line-height:1.2;margin:8px 0 4px}
h2{font-size:21px;line-height:1.25;margin:20px 0 8px}
h3{font-size:18px;margin:16px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button,.btn{font:inherit;font-size:17px;min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.big{width:100%;min-height:54px;font-size:18px}
button:disabled{opacity:.45}
button.link{border:none;background:none;color:var(--accent);padding:10px 4px}
input[type=text],textarea,select{font:inherit;font-size:17px;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);padding:10px 12px}
textarea{min-height:96px;resize:vertical}
input.blank{display:inline-block;width:auto;min-width:90px;max-width:100%;margin:2px 4px;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{flex:1 1 auto}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:8px 0}
.bar > div{height:100%;background:var(--accent);transition:width .25s}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:14px;margin:2px 4px 2px 0}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:16px}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.warn{background:var(--warn-bg);color:var(--warn)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.sel-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.sel-bad{background:var(--bad-bg);border-color:var(--bad)}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:none}
.prompt{font-size:18px;margin-bottom:8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:4px calc(var(--safe-r) + 4px) calc(var(--safe-b) + 4px) calc(var(--safe-l) + 4px);z-index:5}
.tabbar button{flex:1;border:none;background:none;border-radius:10px;font-size:14px;min-height:52px;color:var(--muted);padding:6px 2px}
.tabbar button .ic{display:block;font-size:20px;line-height:1.1}
.tabbar button.on{color:var(--accent);font-weight:600}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.day .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;border:2px solid var(--muted)}
.day .dot.done{background:var(--ok);border-color:var(--ok)}
.day .dot.part{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
.day .grow{flex:1}
.day.today{border-color:var(--accent)}
/* player */
#player{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#player.open{display:flex}
#pHead{padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 12px) 6px calc(var(--safe-l) + 12px);border-bottom:1px solid var(--line);background:var(--card)}
#pBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px calc(var(--safe-r) + 16px) 24px calc(var(--safe-l) + 16px)}
#pFoot{display:flex;gap:10px;padding:10px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px);border-top:1px solid var(--line);background:var(--card)}
#pFoot button{flex:1}
.flip{display:block;width:100%;min-height:96px;margin:8px 0;text-align:center;font-size:21px;font-weight:600}
.flip .ex{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:6px}
.flip.back{background:var(--chip)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tokens button{padding:8px 12px}
.built{min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:4px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match button{width:100%;text-align:left;font-size:16px}
.match button.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.match button.done{background:var(--ok-bg);border-color:var(--ok)}
.match button.flash{background:var(--bad-bg);border-color:var(--bad)}
.md table{border-collapse:collapse;width:100%;font-size:16px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.md ul,.md ol{padding-left:22px;margin:6px 0}
.german{font-size:18px}
pre.report{white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.rate button{flex:1}
.rate button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 90px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* flashcards */
.g-der{color:#1f6feb}.g-die{color:#d1242f}.g-das{color:#1a7f37}
@media (prefers-color-scheme: dark){.g-der{color:#79a8ff}.g-die{color:#ff8a8a}.g-das{color:#66d38a}}
#study{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
#study.open{display:flex}
#sHead{padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 12px) 6px calc(var(--safe-l) + 12px);border-bottom:1px solid var(--line);background:var(--card)}
#sBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px calc(var(--safe-r) + 16px) 24px calc(var(--safe-l) + 16px)}
#sFoot{display:flex;gap:10px;padding:10px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px);border-top:1px solid var(--line);background:var(--card)}
#sFoot > button{flex:1}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;text-align:center}
.fc-en{font-size:22px;font-weight:600}
.fc-de{font-size:28px;font-weight:700;margin:6px 0}
.fc-sub{color:var(--muted);font-size:16px;margin:4px 0}
.fc-ex{font-size:18px;margin-top:12px}
.fc-notes{font-size:15px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.imgbox img{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:12px auto 4px}
.credit{font-size:12px;color:var(--muted)} .credit a{color:var(--muted)}
.spk{min-width:44px;min-height:44px;padding:4px 8px;border:none;background:none;font-size:20px;vertical-align:middle}
.small-btn{font-size:15px}
.rategrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;font-weight:600;font-size:16px;min-height:56px}
.rb .ivl{font-size:13px;font-weight:400;color:var(--muted)}
.rb.again{color:var(--bad)} .rb.good{color:var(--ok)} .rb.easy{color:var(--accent)}
.stats3{display:flex;text-align:center} .stats3>div{flex:1} .stats3 strong{display:block;font-size:30px} .stats3 span{font-size:14px;color:var(--muted)}
.c-new{color:var(--accent)} .c-learn{color:var(--bad)} .c-rev{color:var(--ok)}
.warnbox{background:var(--warn-bg);border-color:var(--warn)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.vrow{display:flex;align-items:center;gap:6px} .vrow .flip{flex:1}
.setrow{display:flex;align-items:center;gap:12px;margin:10px 0} .setrow > span{flex:1}
.setrow input,.setrow select{width:auto;min-width:120px;flex:0 0 auto}
input[type=number]{font:inherit;font-size:17px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px 12px}

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today"><span class="ic">☀︎</span>Today</button>
  <button data-tab="cards"><span class="ic">🂠</span>Cards</button>
  <button data-tab="week"><span class="ic">▦</span>Week</button>
  <button data-tab="report"><span class="ic">✓</span>Report</button>
  <button data-tab="settings"><span class="ic">⚙︎</span>Settings</button>
</nav>

<section id="player" aria-modal="true">

      <button class="link" id="pClose" style="flex:0 0 auto">✕ Close</button>
      <div id="pTitle" style="flex:1;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
      <div id="pCount" class="muted small" style="flex:0 0 auto;text-align:right;min-width:56px"></div>
    </div>
    <div class="bar"><div id="pBar" style="width:0"></div></div>
  </div>
  <div id="pBody"></div>
  <div id="pFoot">
    <button id="pBack">‹ Back</button>
    <button id="pNext" class="primary">Next ›</button>
  </div>
</section>

<section id="study" aria-modal="true">
  <div id="sHead">
    <div class="row" style="flex-wrap:nowrap">
      <button class="link" id="sClose" style="flex:0 0 auto">✕ Close</button>
      <div id="sCount" style="flex:1;text-align:center;font-weight:600"></div>
      <button class="link" id="sUndo" style="flex:0 0 auto">↶ Undo</button>

  </div>
  <div id="sBody"></div>
  <div id="sFoot"></div>
</section>

<script>
"use strict";
/* ---------- storage (all keys prefixed dl_) ---------- */
const store = {
  get(key, fallback){ try{ const v = localStorage.getItem("dl_"+key); return v === null ? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem("dl_"+key, JSON.stringify(val)); return true; }catch(e){ toast("Could not save (storage full or blocked)"); return false; } },
  del(key){ try{ localStorage.removeItem("dl_"+key); }catch(e){} },

const pad2 = n => String(n).padStart(2,"0");

/* ---------- dates (local, date-only) ---------- */
function parseDate(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }

function daysBetween(a,b){ return Math.round((b-a)/86400000); }

/* ---------- state ---------- */
const S = { index:null, weeks:{}, currentWeek:null, viewWeek:null, tab:"today", offline:false };

function knownWeeks(){
  const map = {};

  return Object.values(map).sort((a,b)=>a.week-b.week);
}
function findCurrent(list){
  const t=today();
  const hit=list.find(w=>{ const s=parseDate(w.startDate); if(!s) return false; const d=daysBetween(s,t); return d>=0 && d<7; });
  return hit ? hit.week : null;
}
function getWeek(n){ if(S.weeks[n]) return S.weeks[n]; const w=store.get("week_"+pad2(n),null); if(w) S.weeks[n]=w; return w; }

async function fetchJSON(url){
  const r = await fetch(url+(url.indexOf("?")>-1?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function loadWeekFile(entry){
  if(!entry || !entry.file) return getWeek(entry && entry.week);
  try{
    const w = await fetchJSON(entry.file);
    const err = validateWeek(w);
    if(err) throw new Error(err);
    S.weeks[w.week]=w; store.set("week_"+pad2(w.week), w);
    return w;
  }catch(e){ S.offline=true; return getWeek(entry.week); }
}
async function boot(){
  try{
    const idx = await fetchJSON("weeks/index.json");
    if(idx && Array.isArray(idx.weeks)){ store.set("index", idx); }
  }catch(e){ S.offline=true; }
  const list = knownWeeks();
  S.currentWeek = findCurrent(list);
  if(S.currentWeek===null && list.length){
    // no week covers today: show the latest week that has started, else the first one
    const t=today(); const started=list.filter(w=>{const s=parseDate(w.startDate); return s && s<=t;});
    S.viewWeek = (started.length ? started[started.length-1] : list[0]).week;

function dayStats(week,d){
  const res=getRes(week.week); const dr=res.days[d];

function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); let html="", i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|/.test(l)){
      const rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }

}

/* ---------- validation ---------- */
const KINDS=["multiple_choice","fill_blank","translate","match","order"];
const TYPES=["reading","grammar","vocab","exercises","writing","speaking"];
function validateWeek(w){
  if(!w || typeof w!=="object") return "Not a JSON object.";
  if(!Number.isInteger(w.week)) return "\"week\" must be a whole number.";
  if(!parseDate(w.startDate)) return "\"startDate\" must look like 2026-11-23.";
  if(!Array.isArray(w.days) || !w.days.length) return "\"days\" must be a non-empty list.";
  if(w.cards!==undefined){
    if(!Array.isArray(w.cards)) return "\"cards\" must be a list.";
    const cid=new Set();
    for(const c of w.cards){
      if(!c || !c.id || !c.en || !c.de) return "Each card needs id, en and de.";
      if(cid.has(c.id)) return "Duplicate card id \""+c.id+"\".";
      cid.add(c.id);
      if(c.gender && ["der","die","das"].indexOf(c.gender)<0) return "Card "+c.id+": gender must be der, die or das.";
    }
  }
  const ids=new Set();
  for(const d of w.days){
    if(!Number.isInteger(d.day) || d.day<1 || d.day>7) return "Each day needs \"day\" from 1 to 7.";
    if(!Array.isArray(d.sections)) return "Day "+d.day+" has no \"sections\" list.";
    for(const s of d.sections){
      if(TYPES.indexOf(s.type)<0) return "Day "+d.day+": unknown section type \""+s.type+"\".";
      if(s.type==="exercises"){
        if(!Array.isArray(s.items)) return "Day "+d.day+": exercises need \"items\".";
        for(const it of s.items){
          if(!it.id) return "Day "+d.day+": an exercise has no \"id\".";
          if(ids.has(it.id)) return "Duplicate exercise id \""+it.id+"\".";
          ids.add(it.id);
          if(KINDS.indexOf(it.kind)<0) return "Item "+it.id+": unknown kind \""+it.kind+"\".";
          if(it.kind==="multiple_choice" && (!Array.isArray(it.options) || !Number.isInteger(it.answer))) return "Item "+it.id+": needs options and a numeric answer.";
          if(it.kind==="fill_blank" && !Array.isArray(it.answers)) return "Item "+it.id+": needs \"answers\".";
          if(it.kind==="translate" && !it.modelAnswer) return "Item "+it.id+": needs \"modelAnswer\".";
          if(it.kind==="match" && !Array.isArray(it.pairs)) return "Item "+it.id+": needs \"pairs\".";
          if(it.kind==="order" && !it.answer) return "Item "+it.id+": needs \"answer\".";
        }
      }
    }
  }
  return null;
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function h(tag, attrs, html){ const e=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.indexOf("on")===0) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } if(html!=null) e.innerHTML=html; return e; }
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Copied"); return; }catch(e){}
  const ta=h("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,txt.length); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.remove(); toast(ok?"Copied":"Copy failed — select the text and copy it");
}
function currentDayNum(week){ const s=parseDate(week.startDate); const d=daysBetween(s,today())+1; return (d>=1 && d<=7) ? d : null; }

      "<span class='small' style='text-align:right'>"+label+(st.score!==null?"<br><strong>"+st.score+"%</strong>":"")+"</span>");
    if(!day) b.disabled=true;
    app.appendChild(b);
  }
}

/* ---------- report ---------- */
function correctText(it){
  switch(it.kind){
    case "multiple_choice": return (it.options||[])[it.answer];
    case "fill_blank": return (it.answers||[]).map(a=>Array.isArray(a)?a[0]:a).join(" / ");
    case "translate": return it.modelAnswer;
    case "match": return (it.pairs||[]).map(p=>p[0]+" = "+p[1]).join("; ");
    case "order": return it.answer;
  }
  return "";
}
function vocabOf(week){
  const words=[];
  week.days.forEach(d=>d.sections.forEach(s=>{ if(s.type==="vocab") (s.words||[]).forEach(w=>words.push(w)); }));
  return words;
}
function buildReport(week){
  const res=getRes(week.week); const lines=[]; let done=0, right=0, total=0; const per=[]; const missed=[]; const overr=[]; const rate={writing:[],speaking:[]}; const notes=[]; const weak=new Set();
  const itemsById={}; week.days.forEach(d=>d.sections.forEach(s=>{ if(s.type==="exercises") s.items.forEach(it=>itemsById[it.id]={it,day:d.day}); }));
  const vocab=vocabOf(week).map(w=>({de:w.de, core:norm(String(w.de).replace(/^(der|die|das)\s+/i,""))})).filter(w=>w.core.length>=3);
  for(let d=1; d<=7; d++){
    const dr=res.days[d]; if(!dr){ per.push("D"+d+" –"); continue; }
    if(dr.done) done++;
    const its=Object.values(dr.items); const r=its.filter(i=>i.correct).length; right+=r; total+=its.length;
    per.push("D"+d+" "+(its.length?Math.round(100*r/its.length)+"%":"–"));
    its.forEach(rec=>{
      const ref=itemsById[rec.id]; if(!ref) return; const it=ref.it;
      if(!rec.correct) {
        missed.push("- [D"+d+" "+it.kind+" "+it.id+"] answered \""+(rec.userAnswer||"")+"\" → correct \""+correctText(it)+"\" (topic: "+(it.topic||"–")+")");
        const hay=norm((it.prompt||"")+" "+correctText(it)+" "+(it.words||[]).join(" "));
        (it.words||[]).forEach(w=>weak.add(w));
        vocab.forEach(w=>{ if(hay.indexOf(w.core)>-1) weak.add(w.de); });
      }
      if(rec.overridden) overr.push("- [D"+d+" "+it.id+"] mine: \""+rec.userAnswer+"\" | model: \""+it.modelAnswer+"\"");
    });
    Object.values(dr.ratings||{}).forEach(x=>{ if(rate[x.type] && x.value) rate[x.type].push(x.value); });
    if(dr.notes && dr.notes.trim()) notes.push("D"+d+": "+dr.notes.trim());
  }
  const avg=a=>a.length?(Math.round(10*a.reduce((x,y)=>x+y,0)/a.length)/10)+"/3":"–";
  lines.push("PROGRESS REPORT — Week "+week.week+" ("+week.startDate+")");
  lines.push("Days completed: "+done+"/7   Overall score: "+(total?Math.round(100*right/total)+"%":"–"));
  lines.push("Per day: "+per.join(" | "));
  const mins=[1,2,3,4,5,6,7].map(d=>{ const dr=res.days[d]; return dr&&dr.timeMs?("D"+d+" "+Math.round(dr.timeMs/60000)+"m"):null; }).filter(Boolean);
  if(mins.length) lines.push("Time: "+mins.join(" | "));
  lines.push("Missed items:"); lines.push(missed.length?missed.join("\n"):"- none");
  lines.push("Overridden translations:"); lines.push(overr.length?overr.join("\n"):"- none");
  const cr=cardReportLines(week); cr.weak.forEach(w=>weak.add(w));
  lines.push("Weak words (missed ≥1x): "+(weak.size?Array.from(weak).join(", "):"none"));
  lines.push("Self-ratings: writing "+avg(rate.writing)+", speaking "+avg(rate.speaking));
  cr.lines.forEach(l=>lines.push(l));
  lines.push("My notes: "+(notes.length?notes.join(" | "):"–"));
  return lines.join("\n");
}
function renderReport(app){
  app.appendChild(h("h1",null,"Bericht"));
  weekSelect(app,render);
  const week=S.viewWeek!==null?getWeek(S.viewWeek):null;
  if(!week){ app.appendChild(h("div",{class:"card"},"<p>No week loaded yet.</p>")); return; }
  const txt=buildReport(week);
  app.appendChild(h("button",{class:"primary big",onclick:()=>copyText(txt)},"Copy progress report"));
  app.appendChild(h("p",{class:"muted small"},"Paste it into the chat after “Progress report:”."));
  const pre=h("pre",{class:"report"}); pre.textContent=txt; app.appendChild(pre);
}

/* ---------- player ---------- */
const P={ week:null, d:0, i:0, res:null, dr:null, t0:0 };
function openPlayer(week,d){
  P.week=week; P.d=d; P.res=getRes(week.week); P.dr=dayRes(P.res,d);
  const day=week.days.find(x=>x.day===d);
  P.day=day; P.i = P.dr.done ? 0 : Math.min(P.dr.last||0, day.sections.length);
  P.t0=Date.now();
  $("player").classList.add("open"); document.body.style.overflow="hidden";
  showSection();
}
function stopTimer(){ if(P.t0){ P.dr.timeMs=(P.dr.timeMs||0)+(Date.now()-P.t0); P.t0=0; persist(); } }
function persist(){ P.res.days[P.d]=P.dr; saveRes(P.week.week,P.res); }
function closePlayer(){ stopTimer(); $("player").classList.remove("open"); document.body.style.overflow=""; render(); }
document.addEventListener("visibilitychange",()=>{ if(!$("player").classList.contains("open")) return; if(document.hidden) stopTimer(); else P.t0=Date.now(); });
$("pClose").addEventListener("click",closePlayer);
$("pBack").addEventListener("click",()=>{ if(P.i>0){ P.i--; showSection(); } });
$("pNext").addEventListener("click",()=>{
  const n=P.day.sections.length;
  if(P.i<n){ P.i++; showSection(); }
  else { P.dr.done=true; persist(); closePlayer(); toast("Day "+P.d+" done"); }
});

function showSection(){
  const n=P.day.sections.length; const body=$("pBody"); body.innerHTML=""; body.scrollTop=0;
  $("pTitle").textContent="Day "+P.d+" · "+(P.day.title||"");
  if(P.i<n && P.dr.visited.indexOf(P.i)<0) P.dr.visited.push(P.i);
  P.dr.last=P.i; persist();
  $("pBar").style.width=Math.round(100*Math.min(P.dr.visited.length,n)/n)+"%";
  $("pCount").textContent = P.i<n ? (P.i+1)+"/"+n : "End";
  $("pBack").disabled = P.i===0;
  $("pNext").textContent = P.i<n ? "Next ›" : "Finish ✓";
  if(P.i>=n){ renderFinish(body); return; }
  const s=P.day.sections[P.i];
  ({reading:renderReading,grammar:renderGrammar,vocab:renderVocab,exercises:renderExercises,writing:renderWriting,speaking:renderWriting})[s.type](body,s,P.i);
}

function exFill(box,it,prev){

function exTrans(box,it,prev){

function exMatch(box,it,prev){
  box.appendChild(h("div",{class:"prompt"},inline(it.prompt||"Match the pairs.")));
  const pairs=it.pairs||[]; const grid=h("div",{class:"match"}); box.appendChild(grid);
  const fbw=h("div"); box.appendChild(fbw);
  const left=pairs.map((p,j)=>({t:p[0],j})); const right=shuffle(pairs.map((p,j)=>({t:p[1],j})));
  const lb=[], rb=[]; let pick=null, matched=0; const mistakes=[];
  const finish=(ok,ua)=>{ fbw.innerHTML=""; fbw.appendChild(fbBox(ok, ok?explain(it):"Mistakes: "+esc(ua)+". "+explain(it))); };
  for(let r=0;r<pairs.length;r++){
    const L=h("button",{class:"german"},esc(left[r].t)); const R=h("button",null,esc(right[r].t));
    L.dataset.j=left[r].j; R.dataset.j=right[r].j; lb.push(L); rb.push(R); grid.appendChild(L); grid.appendChild(R);
    L.addEventListener("click",()=>{ if(L.disabled) return; lb.forEach(b=>b.classList.remove("picked")); L.classList.add("picked"); pick=L; });
    R.addEventListener("click",()=>{
      if(R.disabled||!pick) return;
      if(pick.dataset.j===R.dataset.j){ [pick,R].forEach(b=>{ b.classList.remove("picked"); b.classList.add("done"); b.disabled=true; }); pick=null; matched++;
        if(matched===pairs.length){ const ok=mistakes.length===0; const ua=ok?"all pairs":mistakes.join("; "); record(it,ok,ua,false); finish(ok,ua); } }
      else { mistakes.push(pick.textContent+" ≠ "+R.textContent); const p=pick; [p,R].forEach(b=>b.classList.add("flash")); setTimeout(()=>[p,R].forEach(b=>b.classList.remove("flash")),450); }
    });
  }
  if(prev){ lb.concat(rb).forEach(b=>{ b.disabled=true; b.classList.add("done"); }); finish(prev.correct,prev.userAnswer); }
}

function exOrder(box,it,prev){
  box.appendChild(h("div",{class:"prompt"},inline(it.prompt||"Put the words in order.")));

  let pool=shuffle(words.map((t,k)=>({t,k}))); if(pool.length>1 && pool.every((p,k)=>p.k===k)) pool.reverse();
  const built=[]; const bz=h("div",{class:"tokens built"}); const pz=h("div",{class:"tokens"});
  const btn=h("button",{class:"primary"},"Check"); const fbw=h("div");
  box.appendChild(bz); box.appendChild(pz); box.appendChild(btn); box.appendChild(fbw);
  let locked=false;
  const draw=()=>{
    bz.innerHTML=""; pz.innerHTML="";
    built.forEach((w,idx)=>bz.appendChild(h("button",{class:"german",onclick:()=>{ if(locked) return; pool.push(built.splice(idx,1)[0]); draw(); }},esc(w.t))));

    btn.disabled = locked || pool.length>0;

  const finish=(ok,ua)=>{ locked=true; btn.disabled=true; fbw.innerHTML=""; fbw.appendChild(fbBox(ok,(ok?"":"Answer: <strong>"+esc(it.answer)+"</strong>. ")+explain(it))); };
  btn.addEventListener("click",()=>{ const ua=built.map(w=>w.t).join(" "); const ok=norm(ua,true)===norm(it.answer,true); record(it,ok,ua,false); finish(ok,ua); });
  if(prev){ pool=[]; String(prev.userAnswer).split(" ").forEach(t=>built.push({t})); locked=true; draw(); finish(prev.correct,prev.userAnswer); }
  else draw();
}

/* ================= FLASHCARDS (spaced repetition with FSRS) ================= */
const DAY_START_HOUR = 4; // like Anki: a new study day starts at 4 a.m.
function studyDay(d){ const x=new Date(d===undefined?Date.now():d); x.setHours(x.getHours()-DAY_START_HOUR); return new Date(x.getFullYear(),x.getMonth(),x.getDate()); }
function dayKeyOf(d){ const x=studyDay(d); return x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate()); }
function endOfStudyDay(){ const s=studyDay(); return new Date(s.getFullYear(),s.getMonth(),s.getDate()+1,DAY_START_HOUR); }

const CFG_DEFAULT={ newPerDay:10, retention:0.9, autoplay:true, voice:"", rate:1 };
function getCfg(){ return Object.assign({},CFG_DEFAULT,store.get("cfg",{})||{}); }
function setCfg(patch){ store.set("cfg",Object.assign(getCfg(),patch)); SCHED=null; }

let SCHED=null;
function sched(){
  if(!SCHED){ const F=window.FSRS; SCHED=F.fsrs(F.generatorParameters({request_retention:getCfg().retention, enable_fuzz:true})); }
  return SCHED;
}
function ser(c){ return {due:+c.due,s:c.stability,d:c.difficulty,ed:c.elapsed_days,sd:c.scheduled_days,ls:c.learning_steps||0,r:c.reps,l:c.lapses,st:c.state,lr:c.last_review?+c.last_review:null}; }
function deser(o){ return {due:new Date(o.due),stability:o.s,difficulty:o.d,elapsed_days:o.ed,scheduled_days:o.sd,learning_steps:o.ls||0,reps:o.r,lapses:o.l,state:o.st,last_review:o.lr?new Date(o.lr):undefined}; }

function genderOf(c){ if(c.gender) return c.gender; const m=/^(der|die|das)\s/i.exec(c.de||""); return m?m[1].toLowerCase():""; }

/* all cards from every known week, in curriculum order */
function allCards(){
  const out=[];
  knownWeeks().forEach(e=>{
    const w=getWeek(e.week); if(!w || !Array.isArray(w.cards)) return;
    const start=parseDate(w.startDate);
    w.cards.forEach((c,i)=>{ const avail=new Date(start); avail.setDate(avail.getDate()+((c.day||1)-1));
      out.push(Object.assign({},c,{week:w.week,order:w.week*10000+i,avail})); });
  });
  return out;
}
/* cards migrated from Anki get a starting history: learned on their "introduced" date */
function seedIntroduced(cards){
  const srs=store.get("srs",{}); let changed=false; const now=new Date(); const F=window.FSRS;
  cards.forEach(c=>{
    if(srs[c.id] || !c.introduced) return; const d=parseDate(c.introduced); if(!d) return; d.setHours(9);
    if(d>now) return;
    let card=F.createEmptyCard(d);
    card=sched().next(card,d,F.Rating.Good).card;
    card=sched().next(card,new Date(+d+10*60000),F.Rating.Good).card;
    srs[c.id]=ser(card); changed=true;
  });
  if(changed) store.set("srs",srs);
}
function newDoneToday(){ const k=dayKeyOf(); return (store.get("revlog",[])||[]).filter(r=>r[3]===0 && dayKeyOf(r[1]*1000)===k).length; }

function queueState(){
  const cards=allCards(); seedIntroduced(cards);
  const srs=store.get("srs",{}); const now=Date.now(); const eod=+endOfStudyDay(); const today=studyDay();
  const learn=[], rev=[], fresh=[];
  cards.forEach(c=>{
    const s=srs[c.id];
    if(!s){ if(c.avail<=today) fresh.push(c); return; }
    if(s.st===1 || s.st===3) learn.push({c,due:s.due});
    else if(s.due<eod) rev.push({c,due:s.due});
  });
  learn.sort((a,b)=>a.due-b.due); rev.sort((a,b)=>a.due-b.due); fresh.sort((a,b)=>a.order-b.order);
  const newLeft=Math.max(0,getCfg().newPerDay-newDoneToday());
  return {cards,learn,rev,fresh,newLeft,now,
    counts:{ newCount:Math.min(newLeft,fresh.length), learnCount:learn.filter(x=>x.due<eod).length, revCount:rev.length, total:cards.length }};
}
const LEARN_AHEAD_MS=20*60000;
function pickNext(q,shown){
  const dueLearn=q.learn.filter(x=>x.due<=q.now);
  if(dueLearn.length) return dueLearn[0].c;
  const canNew=q.newLeft>0 && q.fresh.length;
  if(q.rev.length && (!canNew || shown%4!==3)) return q.rev[0].c;   // mix: every 4th card is new
  if(canNew) return q.fresh[0];
  if(q.rev.length) return q.rev[0].c;
  const ahead=q.learn.filter(x=>x.due<=q.now+LEARN_AHEAD_MS);
  if(ahead.length) return ahead[0].c;
  return null;
}
function fmtIvl(ms){
  const m=ms/60000; if(m<60) return Math.max(1,Math.round(m))+"m";
  const h=m/60; if(h<24) return Math.round(h)+"h";
  const d=h/24; if(d<30) return Math.round(d)+"d";
  if(d<365) return (Math.round(d/3)/10)+"mo";
  return (Math.round(d/36.5)/10)+"y";
}

/* ---------- audio: recorded Piper voices (audio/<voice>/<key>.mp3), iPhone voice as fallback ---------- */
const FILE_VOICES={thorsten:"Thorsten (male)",kerstin:"Kerstin (female)"};
function ttsClean(text){ return String(text==null?"":text).replace(/…|\.\.\./g," ").replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim(); }
function audioKey(t){ const b=new TextEncoder().encode(t); let h=0x811C9DC5; for(let i=0;i<b.length;i++){ h=Math.imul((h^b[i])>>>0,0x01000193)>>>0; } return ("00000000"+h.toString(16)).slice(-8)+"-"+b.length; }
function voiceMode(){ const v=getCfg().voice; if(!v) return "thorsten"; if(FILE_VOICES[v]||v==="device") return v; return "device"; }
function deviceVoiceURI(){ const c=getCfg(); if(c.deviceVoice) return c.deviceVoice; return (c.voice && !FILE_VOICES[c.voice] && c.voice!=="device") ? c.voice : ""; }
const TTS={
  cur:null,
  voices(){ try{ return speechSynthesis.getVoices().filter(v=>/^de([-_]|$)/i.test(v.lang)); }catch(e){ return []; } },
  pick(){ const vs=this.voices(); const want=deviceVoiceURI(); return vs.find(v=>v.voiceURI===want) || vs.find(v=>/de[-_]DE/i.test(v.lang)) || vs[0] || null; },
  stop(){ try{ if(this.cur){ this.cur.pause(); this.cur=null; } }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} },
  device(t){
    try{
      if(!("speechSynthesis" in window)) return;
      const u=new SpeechSynthesisUtterance(t); u.lang="de-DE"; const v=this.pick(); if(v) u.voice=v; u.rate=getCfg().rate||0.9;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  say(text){
    const t=ttsClean(text); if(!t) return;
    this.stop();
    const mode=voiceMode();
    if(mode==="device"){ this.device(t); return; }
    try{
      const a=new Audio("audio/"+mode+"/"+audioKey(t)+".mp3"); this.cur=a;
      try{ a.preservesPitch=true; a.playbackRate=getCfg().rate||1; }catch(e){}
      let fell=false; const fb=()=>{ if(fell || this.cur!==a) return; fell=true; this.cur=null; this.device(t); };
      a.addEventListener("error",fb);
      const p=a.play(); if(p && p.catch) p.catch(err=>{ if(err && err.name==="NotAllowedError") return; fb(); });
    }catch(e){ this.device(t); }
  }
};
try{ if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged",()=>{}); } }catch(e){}
function speakBtn(text,label){ return h("button",{class:"spk","aria-label":"Play audio",onclick:(e)=>{ e.stopPropagation(); TTS.say(text); }},label||"🔊"); }

/* ---------- images: Openverse (openly licensed, mature content excluded) ---------- */
function imgMap(){ return store.get("img",{})||{}; }
function imgGet(id){ return imgMap()[id]||null; }
function imgSet(id,v){ const m=imgMap(); m[id]=v; store.set("img",m); }
function licLabel(x){ const l=String(x.license||"").toLowerCase(); if(l==="cc0") return "CC0"; if(l==="pdm") return "Public domain"; return "CC "+l.toUpperCase()+(x.license_version?" "+x.license_version:""); }
async function ovSearch(q,page){
  const r=await fetch("https://api.openverse.org/v1/images/?q="+encodeURIComponent(q)+"&page_size=20&page="+page+"&mature=false");
  if(r.status===429) throw new Error("busy");
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  return (j.results||[]).filter(x=>x.url||x.thumbnail).map(x=>({u:x.thumbnail||x.url,o:x.url||"",c:[x.creator||"",licLabel(x)].filter(Boolean).join(" · "),l:x.foreign_landing_url||x.url||""}));
}
/* move to the next image (fetching more when needed). Returns a message on failure. */
async function imgNext(c){
  let e=imgGet(c.id)||{q:c.img||c.en,list:[],i:-1,page:0,hidden:false};
  e.hidden=false;
  if(e.i+1<e.list.length){ e.i++; imgSet(c.id,e); return null; }
  try{
    const more=await ovSearch(e.q,e.page+1);
    if(!more.length){ imgSet(c.id,e); return e.list.length?"No more images. Showing the first again.":"No images found."; }
    e.page++; e.list=e.list.concat(more); e.i++; imgSet(c.id,e); return null;
  }catch(err){
    if(e.list.length){ e.i=0; imgSet(c.id,e); }
    else { const m=imgMap(); delete m[c.id]; store.set("img",m); } // nothing cached yet: retry automatically next time
    return err.message==="busy" ? "The free image search is busy. Try “Next image” again later." : "Image search failed (offline?).";
  }
}
function imgHide(c){ const e=imgGet(c.id)||{q:c.img||c.en,list:[],i:-1,page:0}; e.hidden=true; imgSet(c.id,e); }
function imgCurrent(c){ const e=imgGet(c.id); if(!e || e.hidden || e.i<0 || !e.list[e.i]) return null; return e.list[e.i]; }
function wantsAutoImage(c){ const e=imgGet(c.id); return !!c.img && !e; }
function imgBox(c){
  const box=h("div",{class:"imgbox"}); const cur=imgCurrent(c);
  if(cur){
    const im=h("img",{src:cur.u,alt:c.en,loading:"lazy"});
    im.addEventListener("error",()=>{ if(cur.o && im.src!==cur.o) im.src=cur.o; else { im.remove(); box.appendChild(h("p",{class:"muted small"},"Image didn't load.")); } });
    box.appendChild(im);
    box.appendChild(h("div",{class:"credit"},(cur.c?esc(cur.c)+" · ":"")+(cur.l?"<a href='"+esc(cur.l)+"' target='_blank' rel='noopener'>source</a>":"")));
  }
  return box;
}

/* ---------- study screen ---------- */
const ST={ cur:null, shown:0, revealed:false, undo:null };
function openStudy(){ ST.shown=0; ST.undo=null; $("study").classList.add("open"); document.body.style.overflow="hidden"; studyNext(); }
function closeStudy(){ try{ speechSynthesis.cancel(); }catch(e){} $("study").classList.remove("open"); document.body.style.overflow=""; render(); }
function studyCounts(q){ $("sCount").innerHTML="<span class='c-new'>"+q.counts.newCount+"</span> · <span class='c-learn'>"+q.counts.learnCount+"</span> · <span class='c-rev'>"+q.counts.revCount+"</span>"; }
function studyNext(){
  const q=queueState(); studyCounts(q);
  ST.cur=pickNext(q,ST.shown); ST.revealed=false;
  const body=$("sBody"), foot=$("sFoot"); body.innerHTML=""; foot.innerHTML="";
  $("sUndo").disabled=!ST.undo;
  if(!ST.cur){
    const nextL=q.learn.length?q.learn[0].due:null;
    body.appendChild(h("div",{class:"card",style:"margin-top:24px;text-align:center"},
      "<h2 style='margin-top:0'>Fertig! 🎉</h2><p>No more cards due right now.</p>"+
      (nextL?"<p class='muted'>Next learning card in "+fmtIvl(nextL-Date.now())+".</p>":"")+
      (q.fresh.length && !q.newLeft?"<p class='muted small'>Daily new-card limit reached ("+getCfg().newPerDay+").</p>":"")));
    foot.appendChild(h("button",{class:"primary big",onclick:closeStudy},"Close"));
    return;
  }
  renderFront();
}
function renderFront(){
  const c=ST.cur, body=$("sBody"), foot=$("sFoot"); body.innerHTML=""; foot.innerHTML="";
  const card=h("div",{class:"fc"});
  card.appendChild(h("div",{class:"fc-en"},esc(c.en)));
  const ib=h("div"); card.appendChild(ib); body.appendChild(card);
  const drawImg=()=>{ ib.innerHTML=""; ib.appendChild(imgBox(c)); };
  drawImg();
  if(wantsAutoImage(c)){ imgNext(c).then(()=>{ if(ST.cur===c) drawImg(); }); }
  foot.appendChild(h("button",{class:"primary big",onclick:renderBack},"Show answer"));
}
function renderBack(){
  const c=ST.cur, body=$("sBody"), foot=$("sFoot"); ST.revealed=true; body.innerHTML=""; foot.innerHTML="";
  const card=h("div",{class:"fc"});
  card.appendChild(h("div",{class:"fc-en"},esc(c.en)));
  const ib=h("div"); card.appendChild(ib);
  const msg=h("p",{class:"muted small",style:"text-align:center;margin:4px 0"});
  const drawImg=()=>{ ib.innerHTML=""; ib.appendChild(imgBox(c)); };
  drawImg();
  card.appendChild(h("hr"));
  const de=h("div",{class:"fc-de g-"+genderOf(c)},esc(c.de)+" "); de.appendChild(speakBtn(c.de)); card.appendChild(de);
  if(c.plural) card.appendChild(h("div",{class:"fc-sub"},"Pl.: "+esc(c.plural)));
  if(c.example){ const ex=h("div",{class:"fc-ex"},esc(c.example)+" "); ex.appendChild(speakBtn(c.example)); card.appendChild(ex); }
  if(c.exampleEn) card.appendChild(h("div",{class:"fc-sub"},esc(c.exampleEn)));
  if(c.notes) card.appendChild(h("div",{class:"fc-notes"},esc(c.notes)));
  const ir=h("div",{class:"row",style:"margin-top:12px"});
  ir.appendChild(h("button",{class:"small-btn",onclick:async()=>{ msg.textContent="Searching…"; const m=await imgNext(c); msg.textContent=m||""; drawImg(); }},"Next image"));
  ir.appendChild(h("button",{class:"small-btn",onclick:()=>{ imgHide(c); msg.textContent=""; drawImg(); }},"No image"));
  card.appendChild(ir); card.appendChild(msg);
  body.appendChild(card);
  if(getCfg().autoplay) TTS.say(c.de);
  // rating buttons with interval previews
  const F=window.FSRS; const srs=store.get("srs",{}); const now=new Date();
  const prev=srs[c.id]?deser(srs[c.id]):F.createEmptyCard(now);
  let prevw=null; try{ prevw=sched().repeat(prev,now); }catch(e){}
  const labels=[["Again",F.Rating.Again,"again"],["Hard",F.Rating.Hard,"hard"],["Good",F.Rating.Good,"good"],["Easy",F.Rating.Easy,"easy"]];
  const grid=h("div",{class:"rategrid"});
  labels.forEach(([lab,r,cls])=>{
    const ivl=prevw?fmtIvl(prevw[r].card.due-now):"";
    grid.appendChild(h("button",{class:"rb "+cls,onclick:()=>rateCard(c,r)},"<span class='ivl'>"+ivl+"</span>"+lab));
  });
  foot.appendChild(grid);
}
function rateCard(c,rating){
  const F=window.FSRS; const srs=store.get("srs",{}); const log=store.get("revlog",[])||[]; const now=new Date();
  const before=srs[c.id]||null;
  const prev=before?deser(before):F.createEmptyCard(now);
  const res=sched().next(prev,now,rating);
  srs[c.id]=ser(res.card); store.set("srs",srs);
  log.push([c.id,Math.round(+now/1000),rating,prev.state]); store.set("revlog",log);
  ST.undo={id:c.id,before}; ST.shown++;
  studyNext();
}
function undoRating(){
  if(!ST.undo) return;
  const srs=store.get("srs",{}); const log=store.get("revlog",[])||[];
  if(ST.undo.before) srs[ST.undo.id]=ST.undo.before; else delete srs[ST.undo.id];
  for(let i=log.length-1;i>=0;i--){ if(log[i][0]===ST.undo.id){ log.splice(i,1); break; } }
  store.set("srs",srs); store.set("revlog",log); ST.shown=Math.max(0,ST.shown-1);
  const id=ST.undo.id; ST.undo=null;
  const c=allCards().find(x=>x.id===id); if(c){ ST.cur=c; renderFront(); studyCounts(queueState()); $("sUndo").disabled=true; } else studyNext();
}

/* ---------- Cards tab ---------- */
function renderCards(app){
  app.appendChild(h("h1",null,"Karten"));
  const q=queueState();
  if(!q.cards.length){ app.appendChild(h("div",{class:"card"},"<p>No flashcards yet. They come with each week's lesson file.</p>")); return; }
  const k=q.counts;
  const card=h("div",{class:"card"});
  card.innerHTML="<div class='stats3'><div><strong class='c-new'>"+k.newCount+"</strong><span>new</span></div><div><strong class='c-learn'>"+k.learnCount+"</strong><span>learning</span></div><div><strong class='c-rev'>"+k.revCount+"</strong><span>to review</span></div></div>";
  card.appendChild(h("button",{class:"primary big",style:"margin-top:12px",onclick:openStudy},(k.newCount+k.learnCount+k.revCount)?"Study now":"Check for cards"));
  app.appendChild(card);
  const srs=store.get("srs",{}); const learned=Object.keys(srs).length;
  const log=store.get("revlog",[])||[]; const tk=dayKeyOf(); const todayRev=log.filter(r=>dayKeyOf(r[1]*1000)===tk);
  app.appendChild(h("p",{class:"muted small"},"Today: "+todayRev.length+" reviews · "+learned+" of "+q.cards.length+" cards started · "+getCfg().newPerDay+" new/day (Settings)"));
  backupNag(app);
}

/* ---------- backup reminder + files ---------- */
function hasStudyData(){ return Object.keys(store.get("srs",{})||{}).length>0; }
function backupNag(app){
  const last=store.get("lastBackup",0)||0;
  if(hasStudyData() && Date.now()-last>7*86400000){
    const c=h("div",{class:"card warnbox"},"<p style='margin-top:0'><strong>Back up your progress.</strong> Your flashcard history lives only on this phone.</p>");
    c.appendChild(h("button",{class:"big",onclick:saveBackupFile},"Save backup file"));
    app.appendChild(c);
  }
}
async function saveFile(name,text,mime){
  try{
    const f=new File([text],name,{type:mime});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime}));
    const a=h("a",{href:url,download:name}); document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },3000); return true;
  }catch(e){ toast("Could not save the file"); return false; }
}
function backupJSON(){ const data={}; store.keys().forEach(k=>{ try{ data[k]=JSON.parse(localStorage.getItem(k)); }catch(e){} }); return JSON.stringify({app:"deutsch",exported:new Date().toISOString(),data}); }
async function saveBackupFile(){
  const d=new Date(); const name="deutsch-backup-"+d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+".json";
  if(await saveFile(name,backupJSON(),"application/json")){ store.set("lastBackup",Date.now()); toast("Backup saved"); render(); }
}
function ankiExport(weekFilter){
  const clean=s=>String(s==null?"":s).replace(/[\t\r\n]+/g," ");
  const rows=["#separator:tab","#html:true","#notetype:German Vocab","#deck:German::App export","#columns:English\tGerman\tGender\tPlural\tExample\tExampleEN\tNotes\tTags","#tags column:8"];
  allCards().filter(c=>weekFilter==null||c.week===weekFilter).forEach(c=>{
    const t="w"+pad2(c.week)+" w"+pad2(c.week)+"d"+(c.day||1);
    rows.push([c.en,c.de,c.gender||"",c.plural,c.example,c.exampleEn,c.notes,t].map(clean).join("\t"));
  });
  return rows.join("\n")+"\n";
}

/* ---------- report lines for flashcards ---------- */
function cardReportLines(week){
  const start=parseDate(week.startDate); const end=new Date(start); end.setDate(end.getDate()+7);
  const ks=new Set(); for(let d=new Date(start); d<end; d.setDate(d.getDate()+1)) ks.add(d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()));
  const log=(store.get("revlog",[])||[]).filter(r=>ks.has(dayKeyOf(r[1]*1000)));
  if(!log.length) return {lines:["Flashcards: no reviews this week"],weak:[]};
  const nw=log.filter(r=>r[3]===0).length; const revs=log.filter(r=>r[3]===2);
  const ok=revs.filter(r=>r[2]>1).length;
  const byId={}; allCards().forEach(c=>byId[c.id]=c);
  const again={}; log.filter(r=>r[2]===1).forEach(r=>{ again[r[0]]=(again[r[0]]||0)+1; });
  const weak=Object.keys(again).sort((a,b)=>again[b]-again[a]).map(id=>byId[id]?byId[id].de:id);
  const lines=["Flashcards: "+log.length+" reviews ("+nw+" new cards), retention "+(revs.length?Math.round(100*ok/revs.length)+"% on "+revs.length+" mature reviews":"– (no mature reviews yet)"),
    "Cards rated Again: "+(weak.length?Object.keys(again).sort((a,b)=>again[b]-again[a]).map(id=>(byId[id]?byId[id].de:id)+" ×"+again[id]).join(", "):"none")];
  return {lines,weak};
}
$("sClose").addEventListener("click",closeStudy);
$("sUndo").addEventListener("click",undoRating);

boot();
